version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: telegram-export-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: telegram
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: telegram-export-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: telegram-export-backend
    ports:
      - "8000:8000"
    environment:
      - ENV=development
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/telegram
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
    networks:
      - telegram-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: telegram-export-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - telegram-network
    depends_on:
      backend:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: telegram-export-worker
    environment:
      - ENV=development
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/telegram
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
    # Worker: runs Celery worker. The same image is used for backend and worker;
    # docker-compose overrides the command for the worker service.
    command: celery -A backend.worker:celery_app worker --loglevel=info
    networks:
      - telegram-network
    depends_on:
      - redis
      - postgres

volumes:
  postgres_data:
  redis_data:

networks:
  telegram-network:
    driver: bridge

# Usage:
# docker-compose up -d --build    # Start all services in the background
# docker-compose logs -f backend  # Tail backend logs
# docker-compose down -v         # Stop and remove containers + volumes
