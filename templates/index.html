<!doctype html>
<html dir="rtl" lang="fa">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Telegram Export Parser - Web UI</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        background: white;
        border-radius: 12px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        max-width: 900px;
        width: 100%;
        padding: 40px;
      }

      h1 {
        color: #333;
        text-align: center;
        margin-bottom: 10px;
        font-size: 2em;
      }

      .subtitle {
        text-align: center;
        color: #666;
        margin-bottom: 30px;
        font-size: 0.95em;
      }

      .upload-section {
        background: #f8f9fa;
        border: 2px dashed #667eea;
        border-radius: 8px;
        padding: 40px;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-bottom: 30px;
      }

      .upload-section:hover {
        border-color: #764ba2;
        background: #f0f1ff;
      }

      .upload-section input {
        display: none;
      }

      .upload-icon {
        font-size: 3em;
        margin-bottom: 10px;
      }

      .upload-text {
        color: #333;
        font-size: 1.1em;
        margin-bottom: 5px;
      }

      .upload-hint {
        color: #999;
        font-size: 0.9em;
      }

      .chats-section {
        display: none;
        margin-top: 30px;
      }

      .chats-title {
        color: #333;
        font-size: 1.3em;
        margin-bottom: 20px;
        border-bottom: 2px solid #667eea;
        padding-bottom: 10px;
      }

      .chat-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 15px;
        margin-bottom: 20px;
      }

      .chat-card {
        background: white;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 15px;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .chat-card:hover {
        border-color: #667eea;
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        transform: translateY(-2px);
      }

      .chat-card.selected {
        background: #667eea;
        color: white;
        border-color: #667eea;
      }

      .chat-name {
        font-weight: bold;
        font-size: 1.05em;
        margin-bottom: 5px;
      }

      .chat-count {
        color: #999;
        font-size: 0.9em;
      }

      .chat-card.selected .chat-count {
        color: rgba(255, 255, 255, 0.8);
      }

      .controls-section {
        background: #f8f9fa;
        border-radius: 8px;
        padding: 20px;
        margin-top: 20px;
      }

      .control-group {
        margin-bottom: 15px;
      }

      label {
        display: block;
        color: #333;
        font-weight: 500;
        margin-bottom: 8px;
      }

      select,
      input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 1em;
      }

      select:focus,
      input:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      .button-group {
        display: flex;
        gap: 10px;
        margin-top: 20px;
        flex-wrap: wrap;
      }

      button {
        flex: 1;
        min-width: 120px;
        padding: 12px 20px;
        border: none;
        border-radius: 6px;
        font-size: 1em;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .btn-primary {
        background: #667eea;
        color: white;
      }

      .btn-primary:hover {
        background: #5568d3;
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
      }

      .btn-secondary {
        background: #ddd;
        color: #333;
      }

      .btn-secondary:hover {
        background: #ccc;
      }

      .stats-section {
        background: #f8f9fa;
        border-radius: 8px;
        padding: 20px;
        margin-top: 20px;
        display: none;
      }

      .stats-title {
        font-size: 1.2em;
        font-weight: bold;
        color: #333;
        margin-bottom: 15px;
      }

      .stat-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 15px;
        margin-bottom: 20px;
      }

      .stat-item {
        background: white;
        padding: 15px;
        border-radius: 6px;
        border-left: 4px solid #667eea;
      }

      .stat-label {
        color: #999;
        font-size: 0.9em;
        margin-bottom: 5px;
      }

      .stat-value {
        font-size: 1.5em;
        font-weight: bold;
        color: #333;
      }

      .top-list {
        columns: 2;
        gap: 20px;
        margin-top: 15px;
      }

      .top-item {
        background: white;
        padding: 10px;
        border-radius: 4px;
        margin-bottom: 10px;
        break-inside: avoid;
      }

      .top-label {
        color: #666;
        font-size: 0.9em;
        margin-bottom: 5px;
      }

      .loading {
        display: none;
        text-align: center;
        padding: 20px;
      }

      .spinner {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #667eea;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .message {
        padding: 12px 15px;
        border-radius: 6px;
        margin-top: 15px;
        display: none;
      }

      .message.success {
        background: #d4edda;
        color: #155724;
        display: block;
      }

      .message.error {
        background: #f8d7da;
        color: #721c24;
        display: block;
      }

      @media (max-width: 768px) {
        .container {
          padding: 20px;
        }

        h1 {
          font-size: 1.5em;
        }

        .chat-list {
          grid-template-columns: 1fr;
        }

        .stat-grid {
          grid-template-columns: 1fr;
        }

        .top-list {
          columns: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>📱 Telegram Export Parser</h1>
      <p class="subtitle">Export and analyze your Telegram chats</p>

      <!-- Upload Section -->
      <div class="upload-section" id="uploadSection">
        <input type="file" id="fileInput" accept=".json" />
        <div class="upload-icon">📁</div>
        <div class="upload-text">بارگذاری فایل JSON</div>
        <div class="upload-hint">یا درگ و رها کنید</div>
      </div>

      <!-- Chats Section -->
      <div class="chats-section" id="chatsSection">
        <div class="chats-title">چت‌های موجود</div>
        <div class="chat-list" id="chatList"></div>

        <!-- Controls -->
        <div class="controls-section">
          <div class="control-group">
            <label for="formatSelect">فرمت صادرات:</label>
            <select id="formatSelect">
              <option value="csv">CSV</option>
              <option value="json">JSON</option>
              <option value="html">HTML</option>
              <option value="md">Markdown</option>
              <option value="txt">Text</option>
              <option value="xlsx">Excel</option>
            </select>
          </div>

          <div class="button-group">
            <button class="btn-primary" id="statsBtn">📊 نمایش آمار</button>
            <button class="btn-primary" id="exportBtn">📥 صادرات</button>
            <button class="btn-secondary" id="resetBtn">
              🔄 بارگذاری مجدد
            </button>
          </div>
        </div>

        <!-- Stats Section -->
        <div class="stats-section" id="statsSection">
          <div class="stats-title">📊 آمار چت</div>
          <div class="loading" id="statsLoading">
            <div class="spinner"></div>
          </div>
          <div id="statsContent"></div>
        </div>

        <!-- Messages -->
        <div class="message" id="message"></div>
      </div>
    </div>

    <script>
      const uploadSection = document.getElementById("uploadSection");
      const fileInput = document.getElementById("fileInput");
      const chatsSection = document.getElementById("chatsSection");
      const chatList = document.getElementById("chatList");
      const formatSelect = document.getElementById("formatSelect");
      const statsBtn = document.getElementById("statsBtn");
      const exportBtn = document.getElementById("exportBtn");
      const resetBtn = document.getElementById("resetBtn");
      const statsSection = document.getElementById("statsSection");
      const messageDiv = document.getElementById("message");

      let selectedChatIndex = 0;

      // Upload handling
      uploadSection.addEventListener("click", () => fileInput.click());

      fileInput.addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (file) uploadFile(file);
      });

      uploadSection.addEventListener("dragover", (e) => {
        e.preventDefault();
        uploadSection.style.borderColor = "#764ba2";
      });

      uploadSection.addEventListener("dragleave", () => {
        uploadSection.style.borderColor = "#667eea";
      });

      uploadSection.addEventListener("drop", (e) => {
        e.preventDefault();
        const file = e.dataTransfer.files[0];
        if (file) uploadFile(file);
      });

      async function uploadFile(file) {
        const formData = new FormData();
        formData.append("file", file);

        try {
          const response = await fetch("/api/upload", {
            method: "POST",
            body: formData,
          });
          const data = await response.json();

          if (!response.ok) throw new Error(data.error);

          renderChats(data.chats);
          showMessage(`✅ ${data.total_chats} چت بارگذاری شد`, "success");
          chatsSection.style.display = "block";
        } catch (error) {
          showMessage(`❌ خطا: ${error.message}`, "error");
        }
      }

      function renderChats(chats) {
        chatList.innerHTML = "";
        chats.forEach((chat, index) => {
          const card = document.createElement("div");
          card.className = "chat-card" + (index === 0 ? " selected" : "");
          card.innerHTML = `
                    <div class="chat-name">${chat.name}</div>
                    <div class="chat-count">${chat.message_count} پیام</div>
                `;
          card.addEventListener("click", () => selectChat(index, chats.length));
          chatList.appendChild(card);
        });
      }

      function selectChat(index, total) {
        selectedChatIndex = index;
        document.querySelectorAll(".chat-card").forEach((card, i) => {
          card.classList.toggle("selected", i === index);
        });
        statsSection.style.display = "none";
      }

      statsBtn.addEventListener("click", loadStats);
      exportBtn.addEventListener("click", exportChat);
      resetBtn.addEventListener("click", () => location.reload());

      async function loadStats() {
        statsSection.style.display = "block";
        const loading = document.getElementById("statsLoading");
        loading.style.display = "block";

        try {
          const response = await fetch(`/api/stats/${selectedChatIndex}`);
          const data = await response.json();

          if (!response.ok) throw new Error(data.error);

          const content = document.getElementById("statsContent");
          content.innerHTML = `
                    <div class="stat-grid">
                        <div class="stat-item">
                            <div class="stat-label">کل پیام‌ها</div>
                            <div class="stat-value">${data.total_messages}</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">میانگین طول</div>
                            <div class="stat-value">${data.avg_message_length.toFixed(1)}</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">میانگین روزانه</div>
                            <div class="stat-value">${data.daily_avg.toFixed(1)}</div>
                        </div>
                    </div>
                    <div class="top-list">
                        <div>
                            <div class="top-label" style="font-weight: bold; margin-bottom: 10px;">👥 بهترین سخنران‌ها</div>
                            ${Object.entries(data.top_talkers)
                              .map(
                                ([name, count]) =>
                                  `<div class="top-item">${name}: <strong>${count}</strong></div>`,
                              )
                              .join("")}
                        </div>
                        <div>
                            <div class="top-label" style="font-weight: bold; margin-bottom: 10px;">🔤 کلمات پر استفاده</div>
                            ${Object.entries(data.top_words)
                              .map(
                                ([word, count]) =>
                                  `<div class="top-item">${word}: <strong>${count}</strong></div>`,
                              )
                              .join("")}
                        </div>
                    </div>
                `;
        } catch (error) {
          showMessage(`❌ خطا: ${error.message}`, "error");
        } finally {
          loading.style.display = "none";
        }
      }

      async function exportChat() {
        try {
          const response = await fetch("/api/export", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              chat_index: selectedChatIndex,
              format: formatSelect.value,
            }),
          });
          const data = await response.json();

          if (!response.ok) throw new Error(data.error);

          showMessage(
            `✅ صادرات موفق! فرمت: ${data.format.toUpperCase()}`,
            "success",
          );
          // Auto-download
          window.location.href = `/api/download/${data.file}`;
        } catch (error) {
          showMessage(`❌ خطا: ${error.message}`, "error");
        }
      }

      function showMessage(text, type) {
        messageDiv.textContent = text;
        messageDiv.className = `message ${type}`;
        setTimeout(() => {
          messageDiv.style.display = "none";
        }, 5000);
      }
    </script>
  </body>
</html>
